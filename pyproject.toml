[project]
name = "camcontrol"
version = "0.1.0"
description = "Cross-platform desktop camera control console"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "pyside6>=6.11.2",
]

[project.scripts]
camcontrol = "camcontrol.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camcontrol"]

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
]
